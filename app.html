<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Prediction System</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .app-container {
            max-width: 900px;
            margin: 120px auto 50px;
            background: rgba(0, 31, 63, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(52, 152, 219, 0.3);
            color: #fff;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #e0e0e0;
        }

        .input-group input, .input-group select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #3498db;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: box-shadow 0.3s;
        }

        .input-group input:focus, .input-group select:focus {
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.5);
            background: rgba(255, 255, 255, 0.2);
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .radio-group label {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .btn-predict {
            width: 100%;
            padding: 15px;
            background: #3498db;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Montserrat', sans-serif;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            text-transform: uppercase;
            margin-top: 20px;
        }

        .btn-predict:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }

        .section-header {
            color: #3498db;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            margin-bottom: 20px;
            margin-top: 30px;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body style="background: url('picture/underwater.jpg') no-repeat center center fixed; background-size: cover;">

    <nav class="navbar">
        <a href="index.html" class="logo-container">
            <img src="picture/logo.png" alt="Logo" class="nav-logo" style="height: 50px; width: auto;">
            <span class="logo-text">Prediction Wave</span>
        </a>
        <div class="nav-links">
            <a href="index.html" style="background: rgba(52,152,219,0.3); padding: 8px 15px; border-radius: 5px;">&larr; Back to Home</a>
        </div>
    </nav>

    <div class="app-container">
        <h2 class="section-title" style="margin-top: 0; color: #fff;">🌊 Wave Prediction System</h2>
        <p style="text-align: center; margin-bottom: 30px; color: #bbb;">ระบบพยากรณ์ความสูงคลื่น</p>
        
        <form id="predictForm">
            
            <div class="form-grid">
                <div class="input-group">
                    <label>📍 Select Location (เลือกสถานที่):</label>
                    <select id="location" required>
                        <option value="">-- กรุณาเลือกพื้นที่ชายฝั่ง --</option>
                        <option value="patong">Patong Beach (Phuket)</option>
                        <option value="pattaya">Pattaya (Chonburi)</option>
                        <option value="chaam">Cha-am (Phetchaburi)</option>
                        <option value="pakphanang">Pak Phanang</option>
                        <option value="huasai">Hua Sai</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>⏰ Select Forecast Duration:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="duration" value="6" required> 6 Hours</label>
                        <label><input type="radio" name="duration" value="12"> 12 Hours</label>
                        <label><input type="radio" name="duration" value="24"> 24 Hours</label>
                    </div>
                </div>
            </div>

            <h3 class="section-header">📊 Input Variables (กรุณากรอกตัวเลขให้ครบทุกช่อง)</h3>

            <div class="form-grid">
                <div class="input-group">
                    <label>Significant height of combined wind waves and swell</label>
                    <input type="number" id="v1" step="any" placeholder="เช่น 1.20" required>
                </div>
                <div class="input-group">
                    <label>10m u-component of wind</label>
                    <input type="number" id="v2" step="any" placeholder="เช่น 3.50" required>
                </div>
                <div class="input-group">
                    <label>10m v-component of wind</label>
                    <input type="number" id="v3" step="any" placeholder="เช่น 1.20" required>
                </div>
                <div class="input-group">
                    <label>Instantaneous 10m wind gust</label>
                    <input type="number" id="v4" step="any" placeholder="เช่น 5.50" required>
                </div>
                <div class="input-group">
                    <label>Significant height of wind waves</label>
                    <input type="number" id="v5" step="any" placeholder="เช่น 1.45" required>
                </div>
                <div class="input-group">
                    <label>Significant height of total swell</label>
                    <input type="number" id="v6" step="any" placeholder="เช่น 2.10" required>
                </div>
                <div class="input-group">
                    <label>Mean wave period</label>
                    <input type="number" id="v7" step="any" placeholder="เช่น 4.20" required>
                </div>
                <div class="input-group">
                    <label>Mean wave direction</label>
                    <input type="number" id="v8" step="any" placeholder="เช่น 180" required>
                </div>
                <div class="input-group">
                    <label>2m temperature</label>
                    <input type="number" id="v9" step="any" placeholder="เช่น 28.5" required>
                </div>
                <div class="input-group">
                    <label>Sea surface temperature</label>
                    <input type="number" id="v10" step="any" placeholder="เช่น 29.0" required>
                </div>
            </div>

            <button type="submit" class="btn-predict" id="runBtn">🚀 Run Prediction Model</button>
        </form>
    </div>

</body>
</html>
